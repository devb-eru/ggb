<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GGB · 불러오기 디자인</title>
<style>
:root{--ink:#342d35;--muted:#665a60;--accent:#572f4c;--paper:#d8cebb;font-family:"Malgun Gothic",sans-serif;color:var(--ink);background:#100f16}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}main{min-height:100vh;display:grid;place-items:center;padding:4vh 5vw;background:linear-gradient(#100d18c9,#100d18ed),url('images/12-title-background.png') center/cover fixed}.sheet{position:relative;width:min(1240px,100%);min-height:840px;padding:48px 70px 36px;background:radial-gradient(ellipse at 30% 5%,#f2eadb7a,transparent 65%),linear-gradient(95deg,#b5a89433,transparent 4%,transparent 96%,#a0937e66),var(--paper);box-shadow:0 20px 90px #000b,8px 6px 0 -2px #958878,15px 10px 0 -5px #5c5350;border:1px solid #b1a28c;border-radius:3px 16px 4px 5px}.sheet:after{content:"";position:absolute;inset:12px;border:1px solid #8675643b;pointer-events:none}.top{position:relative;text-align:center;padding:9px 0 36px;border-bottom:1px solid #86756475}h1{font-family:"Batang",serif;font-size:38px;font-weight:500;letter-spacing:.16em;margin:0}.close{position:absolute;right:-26px;top:-14px;width:48px;height:48px;border:0;background:none;color:var(--ink);font-size:34px;font-weight:300}.rows{margin-top:28px}.row{display:grid;grid-template-columns:190px 1fr 200px;align-items:center;gap:32px;width:100%;min-height:136px;text-align:left;border:0;border-bottom:1px solid #8b7b684d;background:transparent;padding:20px 24px;color:var(--ink);position:relative}.row.auto{margin-bottom:22px;border:1px solid #958169;border-left:3px solid #74604c;background:#a4957d16}.row.selected{background:#69384e0e;box-shadow:inset 4px 0 var(--accent)}.row:not(:disabled):hover{background:#69384e15}.row:disabled{cursor:default;color:#776b66}.thumb{height:94px;border:1px solid #7b6b5c;outline:1px solid #88756450;outline-offset:4px;overflow:hidden;background:#aa9b8440;display:block}.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.45) sepia(.15)}.thumb.blank{border-style:dashed;border-color:#9a8c7c;outline:none;background:#a99b8418}.copy{display:grid;gap:10px}.title{font-size:23px;font-weight:600}.sub{font-size:16px;color:var(--muted)}.meta{display:grid;gap:10px;text-align:right;font-size:17px;font-variant-numeric:tabular-nums}.duration{font-size:16px;color:var(--muted)}.bottom{display:flex;justify-content:flex-end;align-items:center;gap:32px;padding-top:30px}.back{color:var(--muted);text-decoration:none;font-size:17px;padding:12px}.load{min-width:210px;padding:16px 30px;border:1px solid #624657;background:var(--accent);color:#f8efdf;font-size:20px}.load:disabled{opacity:.4;cursor:default}dialog{border:1px solid #9a8671;padding:40px;background:var(--paper);color:var(--ink);max-width:500px;box-shadow:0 15px 70px #0008}dialog::backdrop{background:#100b16b8}dialog h2{font-size:25px;margin:0 0 24px}dialog p{line-height:1.8}dialog footer{display:flex;justify-content:flex-end;gap:20px;margin-top:25px}dialog button{padding:12px 22px;border:1px solid #74604c;background:transparent;color:var(--ink)}dialog button:last-child{background:var(--accent);color:#fff}.result{position:fixed;bottom:20px;background:#221a29;color:#fff;padding:16px 28px;border:1px solid #b7a0be}.result:empty{display:none}
@media(min-width:1600px){.sheet{width:1320px;min-height:900px;padding:58px 80px}.row{min-height:145px;grid-template-columns:210px 1fr 220px}.thumb{height:104px}.top{padding-bottom:42px}.rows{margin-top:32px}}
@media(max-height:900px) and (min-width:801px){.sheet{width:min(1100px,100%);min-height:0;padding:28px 50px}.top{padding:5px 0 22px}h1{font-size:30px}.rows{margin-top:18px}.row{min-height:103px;padding:14px 20px;grid-template-columns:145px 1fr 190px;gap:26px}.row.auto{margin-bottom:14px}.thumb{height:74px}.title{font-size:20px}.bottom{padding-top:22px}.load{padding:12px 25px;font-size:18px}}@media(max-width:800px){main{padding:20px 12px}.sheet{width:100%;min-height:0;padding:30px 22px}.top{padding:10px 0 26px}h1{font-size:28px}.close{right:-10px;top:-10px}.row{grid-template-columns:105px 1fr;gap:16px;padding:18px 12px}.thumb{height:70px;grid-row:span 2}.title{font-size:18px}.sub{font-size:13px}.meta{grid-column:2;text-align:left;display:flex;flex-wrap:wrap;gap:10px;font-size:12px}.duration{font-size:12px}.bottom{gap:12px}.load{min-width:150px;font-size:17px}}
</style>
<main><section class="sheet" aria-labelledby="heading"><header class="top"><h1 id="heading">불러오기</h1><button class="close" aria-label="닫기">×</button></header>
<div class="rows" role="group" aria-label="저장 기록">

<button class="row" data-name="현관 홀" aria-pressed="false"><span class="thumb"><img src="../../../game/assets/prologue/prologue_mansion_hall_v01.png" alt="현관 홀"></span><span class="copy"><span class="title">현관 홀</span><span class="sub">저택에 도착한 밤</span></span><span class="meta"><time>2026.10.23 · 21:18</time><span class="duration">플레이 01:00:32</span></span></button>

<script>
const rows=[...document.querySelectorAll('.row:not(:disabled)')],modal=document.querySelector('dialog');let selected=rows[0];function select(row){rows.forEach(r=>{r.classList.toggle('selected',r===row);r.setAttribute('aria-pressed',String(r===row))});selected=row}rows.forEach((r,i)=>{r.addEventListener('click',()=>select(r));r.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const next=rows[(i+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length];select(next);next.focus()}})});document.querySelector('#load').onclick=()=>{document.querySelector('#chosen').textContent=selected.dataset.name;modal.showModal();document.querySelector('#cancel').focus()};document.querySelector('#cancel').onclick=()=>modal.close();document.querySelector('#confirm').onclick=()=>{modal.close();document.querySelector('.result').textContent='디자인 시안 — 실제 저장 파일을 불러오지 않습니다.'};document.querySelector('.close').onclick=()=>location.href='gallery.html#board-05';document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.open){document.querySelector('.back').focus()}});
</script></html>
